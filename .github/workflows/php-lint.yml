name: PHP syntax
on:
  push:
    paths:
      - 'web/**/*.php'
      - 'web/index.php'
      - '.github/workflows/php-lint.yml'
  pull_request:
    paths:
      - 'web/**/*.php'
      - 'web/index.php'
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
      - name: Check PHP syntax
        run: find web -type f -name '*.php' -print0 | xargs -0 -n1 php -l
